name: Build APK

on: [push]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
      run: |
        # 1. 第一次故意让它跑，目的是把 P4A 源码下载到服务器上（不管它报不报错）
        yes | buildozer android debug || true
        
        # 2. 疯狂搜索整个服务器，把 P4A 的源码文件找出来
        FILE=$(find /home/runner/.buildozer ~/.buildozer -name "build.py" -path "*pythonforandroid*" 2>/dev/null | head -n 1)
        
        # 3. 只要找到了，就用 sed 强行删掉报错的 .stdout.decode('utf-8') 这段废话
        if [ -n "$FILE" ]; then
          echo "找到了 P4A 源码: $FILE"
          sed -i "s/\.stdout\.decode('utf-8')//g" "$FILE"
          sed -i 's/\.stdout\.decode("utf-8")//g' "$FILE"
          echo "补丁打入成功！"
        fi
        
        # 4. 真正开始第二次编译，这次必定成功！
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-package
        path: bin/*.apk
