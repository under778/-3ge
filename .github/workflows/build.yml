name: Build APK

on: [push]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
      run: |
        # 第一次尝试编译。如果失败，自动修改 avdmanager 的 bug，然后重试。
        yes | buildozer android debug || (
          echo "========================================="
          echo "遇到 avdmanager bug，正在自动打补丁..."
          echo "========================================="
          FILE=$(find ~/.buildozer -name "build.py" -path "*pythonforandroid*" | head -n 1)
          if [ -f "$FILE" ]; then
            # 删掉引起报错的 .stdout.decode('utf-8')
            sed -i "s/avdmanager('list', 'target').stdout.decode('utf-8').split('\\\\n')/avdmanager('list', 'target').split('\\\\n')/" "$FILE"
            echo "补丁已应用到: $FILE"
          fi
          echo "开始重新编译..."
          yes | buildozer android debug
        )

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-package
        path: bin/*.apk
